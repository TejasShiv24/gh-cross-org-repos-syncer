<svg width="1220" height="760" viewBox="0 0 1220 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1220" height="760" fill="#ffffff"/>

  <!-- Title -->
  <text x="610" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">gh-cross-org-repos-syncer: architecture</text>
  <text x="610" y="52" text-anchor="middle" font-size="13" fill="#475569">Local CLI syncs code from a source org repo into a destination org repo via a reviewable Pull Request</text>

  <!-- Actor -->
  <rect x="470" y="80" width="260" height="44" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="600" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">You (in a terminal)</text>
  <line x1="600" y1="124" x2="600" y2="158" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Local machine container -->
  <rect x="430" y="160" width="360" height="580" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="610" y="185" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#334155">YOUR LOCAL MACHINE</text>

  <!-- Local machine steps -->
  <g font-size="13">
    <rect x="460" y="210" width="300" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="610" y="234" text-anchor="middle" font-weight="600" fill="#0f172a">① update CLI (Node.js)</text>
    <text x="610" y="252" text-anchor="middle" fill="#475569">prompts for source &amp; destination org/repo</text>

    <line x1="610" y1="270" x2="610" y2="284" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="460" y="284" width="300" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="610" y="308" text-anchor="middle" font-weight="600" fill="#0f172a">② Prerequisite checks</text>
    <text x="610" y="326" text-anchor="middle" fill="#475569">git --version · gh auth status</text>

    <line x1="610" y1="344" x2="610" y2="358" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="460" y="358" width="300" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="610" y="382" text-anchor="middle" font-weight="600" fill="#0f172a">③ gh repo view</text>
    <text x="610" y="400" text-anchor="middle" fill="#475569">resolve default branch of both repos</text>

    <line x1="610" y1="418" x2="610" y2="432" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="460" y="432" width="300" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="610" y="456" text-anchor="middle" font-weight="600" fill="#0f172a">④ Temp workspace</text>
    <text x="610" y="474" text-anchor="middle" fill="#475569">clone source + destination (shallow)</text>

    <line x1="610" y1="492" x2="610" y2="506" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="460" y="506" width="300" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="610" y="530" text-anchor="middle" font-weight="600" fill="#0f172a">⑤ Mirror sync + commit</text>
    <text x="610" y="548" text-anchor="middle" fill="#475569">replace dest tree with source tree</text>

    <line x1="610" y1="566" x2="610" y2="580" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="460" y="580" width="300" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="610" y="604" text-anchor="middle" font-weight="600" fill="#0f172a">⑥ git push + gh pr create</text>
    <text x="610" y="622" text-anchor="middle" fill="#475569">push branch, open Pull Request</text>

    <line x1="610" y1="640" x2="610" y2="654" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="460" y="654" width="300" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="610" y="678" text-anchor="middle" font-weight="600" fill="#0f172a">⑦ Cleanup</text>
    <text x="610" y="696" text-anchor="middle" fill="#475569">remove temp workspace, always</text>
  </g>

  <!-- Source org container -->
  <rect x="40" y="380" width="300" height="170" rx="14" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="190" y="405" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#0e7490">SOURCE GITHUB ORG</text>
  <rect x="70" y="440" width="240" height="70" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="190" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Source Repo</text>
  <text x="190" y="488" text-anchor="middle" font-size="13" fill="#475569">(default branch)</text>

  <!-- Source -> local machine arrow -->
  <line x1="310" y1="465" x2="458" y2="452" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="384" y="440" text-anchor="middle" font-size="11" fill="#334155">clone (shallow) +</text>
  <text x="384" y="453" text-anchor="middle" font-size="11" fill="#334155">read commit SHA</text>

  <!-- Destination org container -->
  <rect x="860" y="160" width="320" height="580" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1020" y="185" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#047857">DESTINATION GITHUB ORG</text>

  <rect x="890" y="220" width="260" height="70" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="1020" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Destination Repo</text>
  <text x="1020" y="268" text-anchor="middle" font-size="13" fill="#475569">(default branch)</text>

  <rect x="890" y="400" width="260" height="80" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="1020" y="428" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">New Branch</text>
  <text x="1020" y="446" text-anchor="middle" font-size="12" fill="#475569">updated-push-&lt;dd/mm/yyyy&gt;/</text>
  <text x="1020" y="461" text-anchor="middle" font-size="12" fill="#475569">&lt;source-commit-sha&gt;</text>

  <rect x="890" y="560" width="260" height="80" rx="10" fill="#bbf7d0" stroke="#047857" stroke-width="2"/>
  <text x="1020" y="592" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">Pull Request</text>
  <text x="1020" y="610" text-anchor="middle" font-size="12" fill="#065f46">base: destination default branch</text>
  <text x="1020" y="626" text-anchor="middle" font-size="12" fill="#065f46">ready for review</text>

  <!-- local machine -> destination repo (clone) -->
  <line x1="762" y1="450" x2="888" y2="255" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="845" y="345" text-anchor="middle" font-size="11" fill="#334155">clone (shallow)</text>

  <!-- destination repo -> new branch -->
  <line x1="1020" y1="290" x2="1020" y2="400" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1020" y="335" text-anchor="middle" font-size="11" fill="#334155">git checkout -b</text>

  <!-- local machine -> new branch (push) -->
  <line x1="762" y1="600" x2="888" y2="450" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="845" y="510" text-anchor="middle" font-size="11" fill="#334155">push branch</text>

  <!-- new branch -> pull request -->
  <line x1="1020" y1="480" x2="1020" y2="560" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1020" y="525" text-anchor="middle" font-size="11" fill="#334155">gh pr create</text>
</svg>
